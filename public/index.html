<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Thumbloop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a one-screen instrument. Control deck on top (transport, four loop lanes,
   lane settings); the playing surface takes everything that is left. In landscape
   the deck and the pads sit side by side. One committed dark "chassis" look; each
   lane owns a colour and the pads take the colour of the lane being played. */
:root{
  --chassis:#151923; --panel:#1e2431; --key:#2a3244; --key-hi:#39445c;
  --ink:#ecebe4; --dim:#8a91a3; --line:#323a4d; --rec:#ff3d54;
  --t1:#ff7d5c; --t2:#f2c14e; --t3:#4fd3b4; --t4:#a393ff; --lane:var(--t1);
  --display:'Chakra Petch','Avenir Next Condensed','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--chassis);color:var(--ink);font-family:var(--display);font-weight:500;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select{font:inherit;color:inherit;touch-action:manipulation}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{height:100%;max-width:600px;margin:0 auto;display:grid;gap:10px;
  grid-template-rows:minmax(0,auto) minmax(190px,1fr);
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.deck{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{margin:0;flex:none;font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.mark span{color:var(--lane)}
.keysel{display:flex;gap:6px;min-width:0;flex:0 1 auto}
.keysel select{min-width:0;flex:0 1 auto}
#surf{height:36px;flex:none;min-width:0;padding:0 10px;border-radius:10px}

select{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;height:36px;padding:0 8px;font-size:16px;font-weight:600;min-width:0;
  text-overflow:ellipsis;cursor:pointer}
select:disabled{opacity:.35}

.transport{display:flex;gap:6px;align-items:stretch}
.tbtn{height:46px;min-width:46px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;flex:none}
.tbtn:active{background:var(--key)}
.tbtn.txt{flex:1;min-width:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0 6px}
.tbtn.txt[aria-pressed="true"]{color:var(--chassis);background:var(--ink);border-color:var(--ink)}
.tbtn.txt:disabled{opacity:.35}
.play{width:56px}
.play .is{display:none}
.playing .play .ip{display:none}
.playing .play .is{display:block}
.playing .play{background:var(--ink);color:var(--chassis);border-color:var(--ink)}
.rec{width:56px}
.rec i{width:20px;height:20px;border-radius:50%;border:3px solid var(--rec);display:block}
.recording .rec{background:var(--rec);border-color:var(--rec)}
.recording .rec i{background:var(--chassis);border-color:var(--chassis)}
.counting .rec i{background:var(--rec);animation:blink .5s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.bpm{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:10px;flex:none;overflow:hidden}
.bpm button{width:34px;font-size:20px;font-weight:600;color:var(--dim)}
.bpm button:active{background:var(--key)}
.bpm #bpmVal{width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.bpm b{font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bpm small{font-size:9px;letter-spacing:.14em;color:var(--dim);line-height:1}

.status{display:flex;justify-content:space-between;align-items:center;gap:10px;height:16px;
  font-family:var(--mono);font-size:11px;color:var(--dim)}
.status #status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.recording .status #status{color:var(--rec)}
.beats{display:flex;gap:5px;flex:none}
.beats i{width:14px;height:6px;border-radius:3px;background:var(--line);display:block}
.beats i.on{background:var(--ink)}
.beats i.on:first-child{background:var(--lane)}

.lanes{display:flex;flex-direction:column;gap:5px}
.lane{display:flex;gap:5px;height:38px}
.lsel{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 8px 0 5px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);text-align:left}
.lane.sel .lsel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.num{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--c);border:1.5px solid var(--c)}
.lane.sel .num{background:var(--c);color:var(--chassis)}
.nm{width:50px;flex:none;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roll{flex:1;min-width:0;height:28px;position:relative;display:block;border-radius:5px;background:var(--chassis)}
.roll canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mute{width:42px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.mute[aria-pressed="true"]{background:var(--dim);color:var(--chassis);border-color:var(--dim)}
.lane.muted .nm{color:var(--dim)}

.strip{display:grid;grid-template-columns:1.35fr 1fr .8fr .8fr auto;gap:6px;align-items:end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fld select{width:100%;border-color:color-mix(in srgb,var(--lane) 45%,var(--line))}
#clear{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#clear:active{background:var(--key)}
#clear:disabled{opacity:.35}

.pads{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);grid-template-rows:repeat(var(--rows,4),1fr);
  gap:7px;min-height:0;touch-action:none}
.pad{position:relative;border-radius:12px;background:var(--key);border:1px solid var(--line);
  display:flex;align-items:flex-end;padding:6px 7px;min-width:0;min-height:0;
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--dim);touch-action:none;overflow:hidden}
.pad.root{background:var(--key-hi);color:var(--ink)}
.pad.root::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--lane)}
.pad.echo{background:color-mix(in srgb,var(--lane) 38%,var(--key));color:var(--ink)}
.pad.on{background:var(--lane);border-color:var(--lane);color:var(--chassis)}
.pad.on::after{background:var(--chassis)}
.drums .pad{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.drums .pad.on{color:var(--chassis)}

.pads.valves{grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:8px}
.vchart{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.vcell{height:44px;min-width:0;border-radius:8px;background:var(--key);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:var(--mono);font-size:10px;font-weight:500;color:var(--dim)}
.vcell b{font-weight:500;line-height:1;white-space:nowrap}
.vcell .dots{display:flex;gap:3px}
.vcell .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.vcell .dots i.f{background:var(--ink)}
.vcell.echo{background:color-mix(in srgb,var(--lane) 38%,var(--key));color:var(--ink)}
.vcell.on{background:var(--lane);border-color:var(--lane);color:var(--chassis)}
.vcell.on .dots i.f{background:var(--chassis)}
.voct{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:6px;width:84px;min-height:0}
.vrow{display:flex;gap:4px;flex:none}
.vo{flex:1;min-height:0;border-radius:10px;background:var(--key);border:1px solid var(--line);
  font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink);touch-action:none}
.vo.down{background:var(--lane);border-color:var(--lane);color:var(--chassis)}
#vflip,#vfull{height:30px;flex:1;min-width:0;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.vkeys{grid-column:2;grid-row:2;display:grid;place-items:center;min-width:0;min-height:0}
.vfan{width:100%;height:100%;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-start}
.vkey{flex:1;min-height:0;width:66%;border-radius:16px;background:var(--key-hi);border:1px solid var(--line);
  transform:translateX(var(--drop,0%));touch-action:none;display:flex;align-items:center;justify-content:flex-end;
  padding:0 16px 0 0;font-family:var(--mono);font-size:15px;font-weight:500;color:var(--dim)}
.vkey[data-b="0"]{--drop:22%}
.vkey[data-b="1"]{--drop:0%}
.vkey[data-b="2"]{--drop:14%}
.vkey.down{background:var(--lane);border-color:var(--lane);color:var(--chassis)}
.pads.valves.lefty{grid-template-columns:1fr auto}
.pads.valves.lefty .voct{grid-column:2}
.pads.valves.lefty .vkeys{grid-column:1}
.pads.valves.lefty .vfan{align-items:flex-end}
.pads.valves.lefty .vkey{transform:translateX(calc(-1*var(--drop,0%)));justify-content:flex-start;padding:0 0 0 16px}
.pads.valves.lefty .vcell .dots{flex-direction:row-reverse}

.app.full .top,.app.full .lanes,.app.full .strip{display:none}
.app.full{max-width:none}
@media (orientation:portrait){
  .app.full .pads.valves{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .app.full .pads.valves .voct{grid-column:1;grid-row:3;flex-direction:row;width:auto;height:64px}
  .app.full .pads.valves .vkeys{grid-column:1}
  .app.full .vrow{flex-direction:column;width:46px}
  .app.full #vflip,.app.full #vfull{height:auto}
}
@media (orientation:landscape) and (max-height:540px){
  .app{max-width:none;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(300px,5fr) 6fr}
  .play,.rec{width:48px}
  .tbtn.txt{letter-spacing:.03em;padding:0 2px}
}
.app.full{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
@media (orientation:landscape){
  .app.full .vfan{width:55%;height:66%;flex-direction:row;align-items:flex-start;transform:rotate(-12deg)}
  .app.full .pads.valves .vkey{width:auto;height:66%;transform:translateY(var(--drop,0%));align-items:flex-end;justify-content:center;padding:0 0 10px}
  .app.full .pads.valves.lefty .vfan{flex-direction:row-reverse;align-items:flex-start;transform:rotate(12deg)}
}
@media (prefers-reduced-motion:reduce){.counting .rec i{animation:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="deck">
    <header class="top">
      <h1 class="mark">Thumb<span>loop</span></h1>
      <button class="tbtn txt" id="surf" aria-pressed="false">Valves</button>
      <div class="keysel">
        <select id="key" aria-label="Key"></select>
        <select id="scale" aria-label="Scale"></select>
      </div>
    </header>

    <div class="transport">
      <button class="tbtn play" id="play" aria-label="Play or stop">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="ip" d="M7 4l14 8-14 8z" fill="currentColor"/><rect class="is" x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
      </button>
      <button class="tbtn rec" id="rec" aria-label="Record"><i></i></button>
      <button class="tbtn txt" id="met" aria-pressed="true">Click</button>
      <button class="tbtn txt" id="undo" disabled>Undo</button>
      <div class="bpm">
        <button id="bpmDn" aria-label="Slower">−</button>
        <button id="bpmVal" aria-label="Tempo. Tap in time to set it."><b id="bpmNum">92</b><small>BPM</small></button>
        <button id="bpmUp" aria-label="Faster">+</button>
      </div>
    </div>

    <div class="status"><span id="status"></span><span class="beats" id="beats"><i></i><i></i><i></i><i></i></span></div>

    <div class="lanes" id="lanes"></div>

    <div class="strip">
      <label class="fld"><span>Sound</span><select id="sound"></select></label>
      <label class="fld"><span>Quantize</span><select id="quant"></select></label>
      <label class="fld"><span>Bars</span><select id="bars"></select></label>
      <label class="fld"><span>Octave</span><select id="oct"></select></label>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div class="pads" id="pads" aria-label="Playing surface"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app'), padsEl = $('#pads'), lanesEl = $('#lanes'), statusEl = $('#status');

/* ---------- musical tables ---------- */
const NOTE = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALES = {
  minpent:['Min pent',[0,3,5,7,10]], majpent:['Maj pent',[0,2,4,7,9]],
  minor:['Minor',[0,2,3,5,7,8,10]], major:['Major',[0,2,4,5,7,9,11]],
  dorian:['Dorian',[0,2,3,5,7,9,10]], blues:['Blues',[0,3,5,6,7,10]]
};
const QUANT = [['off','Off',0],['4','1/4',1],['8','1/8',.5],['8t','1/8T',1/3],['16','1/16',.25]];
const QG = Object.fromEntries(QUANT.map(q => [q[0], q[2]]));
const DRUMS = ['Kick','Snare','Clap','Rim','Hat','Open','Shaker','Bell','Tom L','Tom M','Tom H','Crash'];
const SOUNDS = {
  drums:{name:'Drums', rev:.07, del:0},
  bass:{name:'Bass', rev:.02, del:0, oct:-1,
    oscs:[{w:'sawtooth',c:0,g:.6},{w:'square',c:-6,g:.35}], cut:250, kt:2, env:2200, fdec:.12, q:5, a:.004, d:.25, s:.7, r:.09, vol:.3},
  keys:{name:'Keys', rev:.2, del:.06, fm:true},
  lead:{name:'Lead', rev:.18, del:.26,
    oscs:[{w:'sawtooth',c:0,g:.5},{w:'square',c:7,g:.3}], cut:900, kt:3, env:2600, fdec:.25, q:5, a:.01, d:.3, s:.75, r:.18, vol:.19, vib:true},
  pad:{name:'Pad', rev:.45, del:.1,
    oscs:[{w:'sawtooth',c:-9,g:.5},{w:'sawtooth',c:9,g:.5},{w:'triangle',c:0,g:.4,oct:-1}], cut:700, kt:1.5, env:600, fdec:.6, q:1, a:.35, d:.8, s:.8, r:1.2, vol:.13},
  pluck:{name:'Pluck', rev:.2, del:.3,
    oscs:[{w:'sawtooth',c:0,g:.6},{w:'triangle',c:0,g:.3,oct:1}], cut:300, kt:1, env:5000, fdec:.07, q:3, a:.002, d:.25, s:0, r:.2, vol:.3}
};

/* ---------- state ---------- */
let S;
let hint = 'Ready';
const demo = () => ({
  bpm:92, key:9, scale:'minpent', met:true, sel:2, surface:'pads', lefty:false,
  tracks:[
    {sound:'drums', bars:1, q:'16', oct:0, mute:false,
      notes:[[0,.1,0],[1,.1,1],[1.75,.1,0],[2.5,.1,0],[3,.1,1],[0,.1,4],[.5,.1,4],[1,.1,4],[1.5,.1,4],[2,.1,4],[2.5,.1,4],[3,.1,4],[3.5,.1,5]].map(n=>[...n,0])},
    {sound:'bass', bars:2, q:'16', oct:-1, mute:false,
      notes:[[0,.5,0],[1.5,.25,0],[2,.4,5],[3,.45,3],[3.5,.4,4],[4,.5,0],[5.5,.25,0],[6,.5,2],[7,.45,1],[7.5,.4,3]].map(n=>[...n,-1])},
    {sound:'keys', bars:2, q:'16', oct:0, mute:false, notes:[]},
    {sound:'lead', bars:4, q:'16', oct:0, mute:false, notes:[]}
  ]
});
const serTracks = () => S.tracks.map(t => ({sound:t.sound, bars:t.bars, q:t.q, oct:t.oct, mute:t.mute,
  notes:t.notes.map(n => n.c ? [+n.s.toFixed(4), +n.d.toFixed(4), n.p, n.o, 1] : [+n.s.toFixed(4), +n.d.toFixed(4), n.p, n.o])}));
const serialize = () => ({v:1, bpm:S.bpm, key:S.key, scale:S.scale, met:S.met, sel:S.sel, surface:S.surface, lefty:S.lefty, tracks:serTracks()});
const deTracks = arr => arr.slice(0,4).map(t => ({
  sound:SOUNDS[t.sound] ? t.sound : 'keys', bars:[1,2,4,8].includes(t.bars) ? t.bars : 2,
  q:t.q in QG ? t.q : '16', oct:Math.max(-2,Math.min(2,t.oct|0)), mute:!!t.mute,
  notes:(t.notes||[]).map(n => ({s:+n[0]||0, d:+n[1]||.1, p:n[2]|0, o:n[3]|0, ...(n[4] ? {c:1} : {})}))}));
function load(d){
  if(!d || !Array.isArray(d.tracks) || d.tracks.length !== 4) return false;
  S = {bpm:Math.max(50,Math.min(200,d.bpm|0||92)), key:((d.key|0)%12+12)%12, scale:SCALES[d.scale]?d.scale:'minpent',
       met:d.met !== false, sel:Math.max(0,Math.min(3,d.sel|0)), surface:d.surface === 'valves' ? 'valves' : 'pads', lefty:!!d.lefty, tracks:deTracks(d.tracks)};
  return true;
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { try{ localStorage.setItem('thumbloop.v1', JSON.stringify(serialize())); }catch(e){} }, 300);
}
const cur = () => S.tracks[S.sel];
const scaleOf = () => SCALES[S.scale][1];
function midiOf(p,o){
  const sc = scaleOf(), r = S.key > 6 ? S.key - 12 : S.key;
  return 48 + r + 12*o + 12*Math.floor(p/sc.length) + sc[p % sc.length];
}
const midiC = (c,o) => 48 + (S.key > 6 ? S.key - 12 : S.key) + 12*o + c;
function qpos(n,tr,L){
  const g = QG[tr.q]; if(!g) return n.s;
  const q = Math.round(n.s/g)*g; return q >= L - 1e-6 ? 0 : q;
}

/* ---------- audio ---------- */
let ctx, master, revIn, delIn, delay, noiseBuf, nodes = [];
function initAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({latencyHint:'interactive'});
  try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.ratio.value = 6; comp.attack.value = .004; comp.release.value = .15;
  master = ctx.createGain(); master.gain.value = .8;
  master.connect(comp); comp.connect(ctx.destination);

  const n = ctx.sampleRate * 2;
  noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0); for(let i=0;i<n;i++) nd[i] = Math.random()*2-1;

  const irN = Math.floor(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, irN, ctx.sampleRate);
  for(let c=0;c<2;c++){ const ch = ir.getChannelData(c); for(let i=0;i<irN;i++) ch[i] = (Math.random()*2-1) * Math.pow(1 - i/irN, 3.2); }
  const conv = ctx.createConvolver(); conv.buffer = ir;
  revIn = ctx.createGain(); const revOut = ctx.createGain(); revOut.gain.value = .7;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(master);

  delIn = ctx.createGain(); delay = ctx.createDelay(2); delay.delayTime.value = 60/S.bpm*.75;
  const fb = ctx.createGain(); fb.gain.value = .36;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  const delOut = ctx.createGain(); delOut.gain.value = .55;
  delIn.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(delOut); delOut.connect(master);

  nodes = S.tracks.map(() => {

/* ---------- transport ---------- */
let playing = false, recording = false, t0 = 0, b0 = 0, schedBeat = 0, timer = null, wakeLock = null;
let flashes = [], dirty = true;

function tick(){

    if(S.met || n < 0) click(timeAt(n), ((n % 4) + 4) % 4 === 0);
  if(end > 0){
    const from = Math.max(schedBeat, 0), spb = 60/S.bpm;
    S.tracks.forEach((tr,i) => {
      const L = tr.bars*4;

/* ---------- recording + undo ---------- */
const undoStack = [];

const held = new Map();

const KEYROWS = ['zxcvb','asdfg','qwert','12345'];
window.addEventListener('keydown', e => {

  lanes.forEach((l,i) => {
    const t = S.tracks[i];
    l.el.classList.toggle('sel', i === S.sel); l.el.classList.toggle('muted', t.mute);
    l.nm.textContent = SOUNDS[t.sound].name; l.mute.setAttribute('aria-pressed', t.mute);
  });
  app.style.setProperty('--lane', `var(--t${S.sel+1})`);
}
const css = getComputedStyle(document.documentElement);
const COL = ['--t1','--t2','--t3','--t4'].map(v => css.getPropertyValue(v).trim());
const C_LINE = css.getPropertyValue('--line').trim(), C_DIM = css.getPropertyValue('--dim').trim(), C_INK = css.getPropertyValue('--ink').trim();
function drawLane(i, beat){
  const tr = S.tracks[i], c = lanes[i].cv, g = c.getContext('2d'), w = c.width, h = c.height, L = tr.bars*4;
  const dpr = w / Math.max(1, c.clientWidth || w);
  g.clearRect(0,0,w,h);
  g.fillStyle = C_LINE;
  for(let b = 1; b < L; b++){ if(tr.bars > 2 && b % 4) continue; const x = Math.round(b/L*w); g.globalAlpha = b % 4 ? .5 : 1; g.fillRect(x, b % 4 ? h*.3 : 0, 1, b % 4 ? h*.4 : h); }
  g.globalAlpha = 1;
  const maxP = tr.sound === 'drums' ? 11 : 19, pad = 3*dpr, nh = Math.max(2*dpr, (h - 2*pad)/12);
  g.fillStyle = tr.mute ? C_DIM : COL[i];
  for(const n of tr.notes){
    if(n.s >= L) continue;
    const x = qpos(n,tr,L)/L*w, y = h - pad - nh - Math.min(1, n.c ? n.p/40 : n.p/maxP)*(h - 2*pad - nh);
    const wd = tr.sound === 'drums' ? 3*dpr : Math.max(3*dpr, n.d/L*w - dpr);
    g.fillRect(x, y, wd, nh);
    if(x + wd > w) g.fillRect(0, y, x + wd - w, nh);
  }
  if(playing && beat >= 0){ g.fillStyle = C_INK; g.fillRect(Math.min(w - 2*dpr, (beat % L)/L*w), 0, 2*dpr, h); }
}

/* ---------- controls ---------- */
const fill = (sel, opts) => { $(sel).innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join(''); };
fill('#key', NOTE.map((n,i) => [i,n]));
fill('#scale', Object.entries(SCALES).map(([k,v]) => [k,v[0]]));
fill('#sound', Object.entries(SOUNDS).map(([k,v]) => [k,v.name]));
fill('#quant', QUANT);
fill('#bars', [1,2,4,8].map(b => [b,b]));
fill('#oct', [2,1,0,-1,-2].map(o => [o, o > 0 ? '+' + o : o < 0 ? '−' + (-o) : '0']));

function syncStrip(){
  const t = cur();
  $('#key').value = S.key; $('#scale').value = S.scale; $('#sound').value = t.sound; $('#quant').value = t.q;
  $('#bars').value = t.bars; $('#oct').value = t.oct; $('#oct').disabled = t.sound === 'drums';
  $('#bpmNum').textContent = S.bpm; $('#met').setAttribute('aria-pressed', S.met);
  syncClear();
}
function syncClear(){ $('#clear').disabled = !cur().notes.length; }
function syncTransport(){
  app.classList.toggle('playing', playing);
  app.classList.toggle('recording', playing && recording);
}
function refresh(){ syncLanes(); syncStrip(); buildPads(); syncMix(); syncTransport(); dirty = true; }

$('#play').addEventListener('click', () => playing ? stop() : play(false));
$('#rec').addEventListener('click', toggleRec);
$('#met').addEventListener('click', () => { S.met = !S.met; syncStrip(); save(); });
$('#undo').addEventListener('click', undo);
$('#key').addEventListener('change', e => { S.key = +e.target.value; buildPads(); save(); });
$('#scale').addEventListener('change', e => { S.scale = e.target.value; buildPads(); save(); });
$('#sound').addEventListener('change', e => {
  const t = cur(); if(!t.notes.length) t.oct = SOUNDS[e.target.value].oct || 0;
  t.sound = e.target.value; refresh(); save();
});
$('#quant').addEventListener('change', e => { cur().q = e.target.value; dirty = true; save(); });
$('#oct').addEventListener('change', e => { cur().oct = +e.target.value; buildPads(); save(); });
$('#bars').addEventListener('change', e => {
  const t = cur(), nb = +e.target.value, ob = t.bars; if(nb === ob) return;
  if(t.notes.length) pushUndo();
  closeOpen();
  if(nb < ob) t.notes = t.notes.filter(n => n.s < nb*4);
  else { const base = t.notes.slice(), L = ob*4; for(let off = L; off < nb*4; off += L) base.forEach(n => t.notes.push({s:n.s + off, d:n.d, p:n.p, o:n.o, c:n.c})); }
  t.bars = nb; dirty = true; syncClear(); save();
});
$('#surf').addEventListener('click', () => { S.surface = S.surface === 'valves' ? 'pads' : 'valves'; buildPads(); save(); });
$('#clear').addEventListener('click', () => { const t = cur(); if(!t.notes.length) return; pushUndo(); releaseAll(); t.notes = []; dirty = true; syncClear(); save(); });

function setBpm(v){
  v = Math.max(50, Math.min(200, Math.round(v))); if(v === S.bpm) return;
  if(playing){ const now = ctx.currentTime; b0 = beatAt(now); t0 = now; }
  S.bpm = v; $('#bpmNum').textContent = v; syncMix(); save();
}
function holdStep(btn, d){
  let to, iv; const end = () => { clearTimeout(to); clearInterval(iv); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); end(); setBpm(S.bpm + d); to = setTimeout(() => { iv = setInterval(() => setBpm(S.bpm + d), 70); }, 400); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, end));
  btn.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.stopPropagation(); setBpm(S.bpm + d); } });
}
holdStep($('#bpmDn'), -1); holdStep($('#bpmUp'), 1);
let taps = [];
$('#bpmVal').addEventListener('click', () => {
  const now = performance.now();
  if(taps.length && now - taps[taps.length-1] > 2000) taps = [];
  taps.push(now); if(taps.length > 5) taps.shift();
  if(taps.length >= 2) setBpm(60000 / ((taps[taps.length-1] - taps[0]) / (taps.length-1)));
});
document.addEventListener('visibilitychange', () => { if(document.hidden){ releaseAll(); stop(); } });

/* ---------- frame loop ---------- */
let litPrev = new Set(), lastStatus = '', lastBeat = -1;
const beatEls = [...$('#beats').children];
function frame(){
  requestAnimationFrame(frame);
  let beat = 0, st = hint, bi = -1, counting = false;
  if(playing){
    const now = ctx.currentTime; beat = beatAt(now - (ctx.outputLatency || 0));
    bi = ((Math.floor(beat) % 4) + 4) % 4;
    if(beat < 0){ counting = true; st = 'Count-in ' + Math.max(1, Math.floor(beat) + 5); }
    else {
      const L = cur().bars*4, pos = beat % L, where = (Math.floor(pos/4) + 1) + '.' + (Math.floor(pos % 4) + 1);
      st = (recording ? 'Recording lane ' + (S.sel+1) + ' · ' : 'Playing · ') + where;
    }
    const lit = new Set();
    flashes = flashes.filter(f => f.end > now);
    for(const f of flashes) if(f.t <= now) lit.add(f.p);
    litPrev.forEach(p => { if(!lit.has(p) && padEls[p]) padEls[p].classList.remove('echo'); });
    lit.forEach(p => { if(!litPrev.has(p) && padEls[p]) padEls[p].classList.add('echo'); });
    litPrev = lit;
  } else if(litPrev.size){ litPrev.forEach(p => padEls[p] && padEls[p].classList.remove('echo')); litPrev = new Set(); }
  app.classList.toggle('counting', counting);
  if(st !== lastStatus){ statusEl.textContent = st; lastStatus = st; }
  if(bi !== lastBeat){ beatEls.forEach((el,i) => el.classList.toggle('on', i === bi)); lastBeat = bi; }
  if(playing || dirty){ for(let i = 0; i < 4; i++) drawLane(i, beat); dirty = false; }
}

/* ---------- boot ---------- */
function start(d){
  let ok = load(d);
  if(!ok){ try{ ok = load(JSON.parse(localStorage.getItem('thumbloop.v1'))); }catch(e){} }
  if(!ok){ load(demo()); hint = 'Demo loop on lanes 1–2. Press play, then record lane 3.'; }
  buildLanes(); refresh(); requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
try{ hot && hot.snapshot && hot.snapshot(() => serialize()); }catch(e){}
if(hot && hot.ready) hot.ready(d => start(d)); else start(hot && hot.data);
})();
</script>
</body>
</html>
